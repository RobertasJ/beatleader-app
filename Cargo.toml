[workspace]
resolver = "2"
members = ["beatleader-api", "beatleader-app", "beatleader-auth", "macros"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "query"] }
# freya = { version = "0.4.0", features = ["query", "remote-asset"] }
freya = { git = "https://github.com/marc2332/freya", features = [
    "query",
    "remote-asset",
    "icons",
] }
freya-icons = { git = "https://github.com/marc2332/freya", features = [
    "lucide",
] }
directories = "6.0.0"
moka = { version = "0.12", features = ["future"] }
keyring = "4.1"
thiserror = "2.0"

macros = { path = "macros" }
beatleader-auth = { path = "beatleader-auth" }
